<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWA-web</title>
    <meta name="description" content="Aplicacion web progresiva" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Configuracion de la Progressive Web App -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Icono utilizado por navegadores y para agregar a pantalla de inicio / escritorio -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main>
      <img class="logo" src="./icons/icon-192.png" alt="Icono de PWA-web" />
      <h1>PWA-web</h1>
      <p>Aplicacion web progresiva</p>
      <p>
        Esta aplicacion puede instalarse en tu escritorio o pantalla de
        inicio para acceder a ella como si fuera una aplicacion nativa.
      </p>
      <button id="install-button" type="button">Instalar aplicacion</button>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
